onboarding = false

[theme]
name = "gruvbox"
auto_switch = false

[ui]
status_indicators = "dots"

[ui.toast]
delivery = "terminal"

[ui.sound]
enabled = false

# Mirrors the zellij binds in ../zellij/config.kdl.
# Zellij's "Ctrl a" normal mode is herdr's prefix mode.
[keys]
prefix = "ctrl+a"

# Pane focus (zellij normal mode h/j/k/l)
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# Pane splits (zellij "-" = split down, "\" = split right)
split_horizontal = "prefix+minus"
split_vertical = "prefix+backslash"

# Fullscreen toggle (zellij "f")
zoom = "prefix+f"

# Pane resize without entering a mode (zellij Shift+h/j/k/l)
resize_pane_left = "prefix+shift+h"
resize_pane_down = "prefix+shift+j"
resize_pane_up = "prefix+shift+k"
resize_pane_right = "prefix+shift+l"
resize_mode = "prefix+shift+e"

# Tabs (zellij Alt+n / Alt+p worked without the prefix, so they are direct here)
next_tab = "alt+n"
previous_tab = "alt+p"
switch_tab = "prefix+1..9"
new_tab = "prefix+t"
rename_tab = "prefix+r"
close_tab = "prefix+shift+x"

# Panes
close_pane = "prefix+x"
clear_pane = "ctrl+b"
